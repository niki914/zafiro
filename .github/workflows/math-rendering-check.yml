name: Math Rendering Check

# Temporary CI for the feat/math-rendering branch: runs the MathSyntaxTest
# unit test, then builds a debug APK (arm64) and publishes it as a release
# asset on the fork, so it can be installed on a real phone without signing
# secrets. This file is removed before the PR to upstream.

on:
  push:
    branches: [feat/math-rendering]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Chaquopy buildPython requirement

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run math unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.niki914.zafiro.app.ui.chat.composable.text.MathSyntaxTest" --no-daemon --stacktrace

      - name: Build debug APK for ARM64 phones
        run: |
          sed -i 's/abiFilters += "x86_64"/abiFilters += "arm64-v8a"/' app/build.gradle.kts
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zafiro-debug-math
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish debug APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Zafiro-debug-math.apk
          ls -lh Zafiro-debug-math.apk
          gh release create "debug-math-${{ github.run_number }}" \
            Zafiro-debug-math.apk \
            --title "Debug build (math rendering test) #${{ github.run_number }}" \
            --notes "Debug APK of the feat/math-rendering branch (LaTeX math rendering in chat: \$...\$ inline, \$\$...\$\$ display). Installs as a separate debug app alongside the release build."
