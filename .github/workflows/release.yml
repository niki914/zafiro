name: release
# Builds the signed, minified RELEASE apk (not the debug one) and publishes it as a normal GitHub release.
# One-time setup: add three repository secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_B64   base64 of zafiro-release.jks
#   RELEASE_STORE_PASSWORD password of the keystore (the key uses the same one)
#   RELEASE_KEY_ALIAS      zafiro
# Run: Actions > release > Run workflow (pick the branch), push a tag like v1.11.0, or push a branch named release/<anything>.
# Keep the keystore safe: an update can only replace an installed app if it is signed with the SAME key.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release/**']
permissions:
  contents: write
env:
  GRADLE_ARGS: --no-daemon --stacktrace --console=plain
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: android-actions/setup-android@v4
        with: { packages: '' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install signing key
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          AL: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "::error::Add the RELEASE_KEYSTORE_B64 / RELEASE_STORE_PASSWORD secrets first (see the header of this file)."; exit 1; fi
          mkdir -p "$HOME/.android_packing" "$HOME/.gradle"
          echo "$KS" | base64 -d > "$HOME/.android_packing/zafiro.jks"
          printf 'RELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' "$PW" "${AL:-zafiro}" "$PW" > "$HOME/.android_packing/signing.properties"
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> "$HOME/.gradle/gradle.properties"
      - name: Assemble release
        run: ./gradlew :app:assembleRelease $GRADLE_ARGS
      - name: Verify it is not debug-signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | tee cert.txt
          ! grep -qi "Android Debug" cert.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          TAG="v${VER}-auto.${GITHUB_RUN_NUMBER}"
          cp "$APK" "zafiro-autonomous-${TAG}.apk"
          gh release create "$TAG" "zafiro-autonomous-${TAG}.apk" --target "$GITHUB_SHA" \
            --title "Zafiro Autonomous ${TAG}" \
            --notes "Release-signed build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. See CHANGELOG.md. Not yet verified on every phone: report problems before relying on it."
          echo "APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/zafiro-autonomous-${TAG}.apk" >> "$GITHUB_STEP_SUMMARY"
