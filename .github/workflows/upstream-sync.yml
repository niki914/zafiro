name: upstream-sync
# Every day (and on demand): replay new commits of niki914/zafiro onto a sync branch, build + test it in ci.yml, and open an
# issue (clean) or a conflict issue (needs a person). Zafiro Autonomous releases then ship the merged result, so the in-app
# updater only has to follow OUR releases.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspaces
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Replay upstream changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git config user.name "upstream-sync"; git config user.email "upstream-sync@users.noreply.github.com"
          OLD=$(cat UPSTREAM_SYNCED_SHA)
          set +e; tools/autonomous/upstream_apply.sh; RC=$?; set -e
          NEW=$(git rev-parse upstream/HEAD 2>/dev/null || git rev-parse upstream/main)
          LIST=$(git log --no-merges --pretty='- %h %s' "$OLD..$NEW" | head -60)
          DATE=$(date +%Y%m%d)
          if [ "$RC" = "0" ] && [ "$OLD" = "$NEW" ]; then echo "Up to date."; exit 0; fi
          if gh issue list --state open --search "Upstream sync in:title" --json number --jq '.[0].number' | grep -q .; then echo "Issue already open."; exit 0; fi
          if [ "$RC" = "0" ]; then
            git commit -q -m "sync: upstream niki914/zafiro up to ${NEW:0:8}" && git push -q origin HEAD:refs/heads/sync/upstream-$DATE
            gh issue create --title "Upstream sync $DATE: ready to merge" --body "$(printf 'Clean replay of upstream into branch `sync/upstream-%s`. CI is running on it; merge it into feat/workspaces when green.\n\nNew upstream commits:\n%s\n' "$DATE" "$LIST")"
          else
            gh issue create --title "Upstream sync $DATE: conflicts" --body "$(printf 'These files conflict and need a person (see UPSTREAM_SYNC.md):\n```\n%s\n```\n\nNew upstream commits:\n%s\n' "$(cat /tmp/conflicts.txt)" "$LIST")"
          fi
